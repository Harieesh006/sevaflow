AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SevaFlow AI civic issue intelligence backend

Parameters:
  BedrockModelId:
    Type: String
    Default: amazon.nova-2-lite-v1:0
    Description: Regional model ID or cross-region inference profile ID
  ProjectName:
    Type: String
    Default: sevaflow

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 60
    MemorySize: 1024
    Environment:
      Variables:
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        REPORTS_TABLE: !Ref ReportsTable
        MEDIA_BUCKET: !Ref MediaBucket

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ['*']
            ExposedHeaders: [ETag]

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  SevaFlowApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: ['content-type']
        AllowMethods: [GET, POST, OPTIONS]

  SevaFlowFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
        - S3ReadPolicy:
            BucketName: !Ref MediaBucket
        - S3WritePolicy:
            BucketName: !Ref MediaBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
              Resource: '*'
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref SevaFlowApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: SevaFlow API Gateway URL
    Value: !GetAtt SevaFlowApi.ApiEndpoint
  ReportsTableName:
    Value: !Ref ReportsTable
  MediaBucketName:
    Value: !Ref MediaBucket
  BedrockModelId:
    Value: !Ref BedrockModelId
